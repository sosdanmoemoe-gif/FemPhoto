<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FemPhoto v3 AI</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f6f6f8;color:#222}
.wrap{max-width:900px;margin:auto;padding:18px}
h1{font-size:24px;margin:0 0 6px}.sub{color:#666;font-size:13px;margin-bottom:14px}
.card{background:#fff;border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 2px 12px #0000000d}
button,label.file{display:inline-block;border:0;border-radius:12px;padding:11px 14px;background:#222;color:#fff;font-weight:600}
button:disabled{opacity:.45}.file{cursor:pointer}.file input{display:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.control{margin:10px 0}.control label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
input[type=range]{width:100%}
canvas{width:100%;height:auto;border-radius:12px;background:#eee;display:block}
.note{font-size:12px;color:#666;line-height:1.6}
.status{font-size:13px;padding:9px 10px;border-radius:10px;background:#f0f2f5}
.badge{display:inline-block;font-size:11px;background:#eee;border-radius:999px;padding:4px 8px;margin-left:5px}
</style>
</head>
<body>
<div class="wrap">
<h1>FemPhoto <span class="badge">v3 AI</span></h1>
<div class="sub">人物の骨格をAIで推定して、胸まわりの自然な補正位置を自動設定します。写真そのものはこのページ内で処理します。</div>

<div class="card">
  <div class="row">
    <label class="file">写真を選ぶ<input id="file" type="file" accept="image/*"></label>
    <button id="ai" disabled>AIで自動設定</button>
    <button id="save" disabled>画像を保存</button>
  </div>
  <p id="status" class="status">まず写真を選んでください。</p>
</div>

<div class="card">
  <div class="control"><label><span>胸のふくらみ</span><b id="amountV">10</b></label><input id="amount" type="range" min="0" max="25" value="10"></div>
  <div class="control"><label><span>胸の中心位置</span><b id="yV">42%</b></label><input id="cy" type="range" min="15" max="75" value="42"></div>
  <div class="control"><label><span>左右の広がり</span><b id="wV">30%</b></label><input id="cw" type="range" min="10" max="55" value="30"></div>
  <div class="control"><label><span>肌のなめらかさ</span><b id="skinV">25</b></label><input id="skin" type="range" min="0" max="50" value="25"></div>
  <div class="note">AIは肩・腰の位置を推定し、その人の体格に合わせて胸の補正位置を自動設定します。補正の強さは手動で微調整できます。</div>
</div>

<div class="card"><canvas id="canvas"></canvas></div>

<script type="module">
let FilesetResolver=null, PoseLandmarker=null;
let mediapipeLoadPromise=null;

async function loadMediaPipe(){
  if(FilesetResolver && PoseLandmarker) return;
  if(!mediapipeLoadPromise){
    mediapipeLoadPromise=(async()=>{
      const mod=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs");
      FilesetResolver=mod.FilesetResolver;
      PoseLandmarker=mod.PoseLandmarker;
    })();
  }
  return mediapipeLoadPromise;
}

const fileEl=document.getElementById('file'), aiBtn=document.getElementById('ai'), saveBtn=document.getElementById('save');
const statusEl=document.getElementById('status'), canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d',{willReadFrequently:true});
const amount=document.getElementById('amount'), cy=document.getElementById('cy'), cw=document.getElementById('cw'), skin=document.getElementById('skin');
const amountV=document.getElementById('amountV'), yV=document.getElementById('yV'), wV=document.getElementById('wV'), skinV=document.getElementById('skinV');
let original=null, aiLandmarks=null, aiReady=null;

function valUI(){
  amountV.textContent=amount.value;
  skinV.textContent=skin.value;
  yV.textContent=aiLandmarks?'AI: '+cy.value+'%':cy.value+'%';
  wV.textContent=aiLandmarks?'AI: '+cw.value+'%':cw.value+'%';
}
[amount,cy,cw,skin].forEach(x=>x.addEventListener('input',()=>{valUI();render();}));

fileEl.addEventListener('change', e=>{
  const f=e.target.files?.[0]; if(!f)return;
  const im=new Image();
  im.onload=()=>{
    const max=1600, scale=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
    canvas.width=Math.round(im.naturalWidth*scale); canvas.height=Math.round(im.naturalHeight*scale);
    original=document.createElement('canvas'); original.width=canvas.width; original.height=canvas.height;
    original.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);
    ctx.drawImage(original,0,0);
    aiBtn.disabled=false; saveBtn.disabled=false; aiLandmarks=null; aiReady=null;
    statusEl.textContent='写真を読み込みました。「AIで自動設定」を押してください。';
    valUI();
    URL.revokeObjectURL(im.src);
  };
  im.onerror=()=>{
    statusEl.textContent='この写真を読み込めませんでした。iPhoneの「写真」から別の写真を選んでください。';
  };
  im.src=URL.createObjectURL(f);
});

async function getPose(){
  if(aiReady)return aiReady;
  aiReady=(async()=>{
    statusEl.textContent='AIモデルを読み込んでいます。初回は少し時間がかかります…';
    await loadMediaPipe();
    const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm");
    return await PoseLandmarker.createFromOptions(vision,{
      baseOptions:{
        modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
        delegate:"GPU"
      },
      runningMode:"IMAGE",
      numPoses:1
    });
  })();
  try {
    return await aiReady;
  } catch(e) {
    aiReady=null;
    throw e;
  }
}

aiBtn.addEventListener('click',async()=>{
  if(!original)return;
  try{
    aiBtn.disabled=true;
    const pose=await getPose();
    const r=pose.detect(original);
    if(!r.landmarks?.length) throw new Error('no person');
    aiLandmarks=r.landmarks[0];
    const L=aiLandmarks[11], R=aiLandmarks[12], LH=aiLandmarks[23], RH=aiLandmarks[24];
    const shoulderY=(L.y+R.y)/2, hipY=(LH.y+RH.y)/2;
    const chestY=shoulderY+(hipY-shoulderY)*0.30;
    const shoulderW=Math.abs(L.x-R.x);
    cy.value=Math.round(Math.max(.15,Math.min(.75,chestY))*100);
    cw.value=Math.max(15,Math.min(48,Math.round(shoulderW*100*.82)));
    valUI(); statusEl.textContent='AIが肩・腰を検出しました。胸の補正位置を自動設定しました。';
    render();
  }catch(err){
    console.error(err);
    const msg=String(err?.message||err);
    if(msg.includes('Failed to fetch') || msg.includes('Importing a module') || msg.includes('NetworkError')){
      statusEl.textContent='AIモデルを読み込めませんでした。写真自体は表示できるはずなので、まずページを再読み込みして試してください。';
    }else{
      statusEl.textContent='AI検出に失敗しました。人物が小さい写真では手動調整を試してください。';
    }
  }finally{aiBtn.disabled=false;}
});

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

function warpChest(w,h,src,amountVal){
  if(amountVal<=0)return src;
  const out=new ImageData(w,h), d=out.data, s=src.data;
  const cx=w*.5, centerY=h*(Number(cy.value)/100), halfW=w*(Number(cw.value)/200);
  const separation=halfW*.72;
  const centers=[[cx-separation,centerY],[cx+separation,centerY]];
  const strength=Number(amountVal)/25*.20;
  const sx0=Math.max(28,halfW*.68), sy0=Math.max(34,h*.105);
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      let sx=x,sy=y;
      for(const [bx,by] of centers){
        const dx=x-bx,dy=y-by;
        const q=(dx*dx)/(sx0*sx0)+(dy*dy)/(sy0*sy0);
        if(q<5){
          const g=Math.exp(-q);
          sx-=dx*strength*g;
          sy-=dy*strength*.52*g;
        }
      }
      sx=clamp(Math.round(sx),0,w-1); sy=clamp(Math.round(sy),0,h-1);
      const si=(sy*w+sx)*4,di=(y*w+x)*4;
      d[di]=s[si];d[di+1]=s[si+1];d[di+2]=s[si+2];d[di+3]=255;
    }
  }
  return out;
}

function skinSmooth(w,h,data,amt){
  if(amt<=0)return data;
  const out=new ImageData(w,h),d=out.data,s=data.data,a=amt/50*.34;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4; let lum=0,n=0;
    for(let yy=-1;yy<=1;yy++)for(let xx=-1;xx<=1;xx++){
      const X=clamp(x+xx,0,w-1),Y=clamp(y+yy,0,h-1),j=(Y*w+X)*4;
      lum+=.2126*s[j]+.7152*s[j+1]+.0722*s[j+2]; n++;
    }
    const old=.2126*s[i]+.7152*s[i+1]+.0722*s[i+2], nl=old*(1-a)+(lum/n)*a, ratio=old>8?nl/old:1;
    d[i]=clamp(s[i]*ratio,0,255);d[i+1]=clamp(s[i+1]*ratio,0,255);d[i+2]=clamp(s[i+2]*ratio,0,255);d[i+3]=255;
  }
  return out;
}

let timer=null;
function render(){
  if(!original)return;
  clearTimeout(timer);
  timer=setTimeout(()=>{
    const w=canvas.width,h=canvas.height,base=original.getContext('2d').getImageData(0,0,w,h);
    const warped=warpChest(w,h,base,Number(amount.value));
    ctx.putImageData(skinSmooth(w,h,warped,Number(skin.value)),0,0);
  },20);
}

saveBtn.addEventListener('click',()=>{
  if(!original)return;
  const a=document.createElement('a');a.download='FemPhoto_v3.jpg';a.href=canvas.toDataURL('image/jpeg',.94);a.click();
});
valUI();
</script>
</body>
</html>
