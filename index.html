<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6e9ef">
<title>FemPhoto</title>
<style>
:root{--bg:#faf7f8;--card:#fff;--accent:#c86f91;--text:#352b30;--muted:#776b71}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
header{padding:20px 18px 8px;text-align:center}h1{font-size:24px;margin:0 0 5px}.sub{color:var(--muted);font-size:13px}
main{max-width:760px;margin:auto;padding:10px 14px 30px}.card{background:var(--card);border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 2px 14px #0000000d}
button,.filelabel{border:0;border-radius:13px;padding:12px 16px;font-size:15px;font-weight:600;background:var(--accent);color:white;display:inline-block;cursor:pointer}
button:disabled{opacity:.45}.filelabel{flex:1;text-align:center}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=file]{display:none}label{font-size:14px}.range{width:100%;accent-color:var(--accent)}.value{float:right;color:var(--muted)}
.preview{display:grid;grid-template-columns:1fr 1fr;gap:10px}.preview figure{margin:0}.preview img{width:100%;border-radius:12px;background:#eee;display:block}.cap{text-align:center;font-size:12px;color:var(--muted);margin-top:5px}
canvas{display:none}.hint{font-size:12px;line-height:1.6;color:var(--muted)}.danger{font-size:11px;color:#8b5c68}
.status{font-size:12px;color:var(--muted);text-align:center;min-height:18px;margin:8px 0 0}
@media(max-width:500px){.preview{grid-template-columns:1fr}.row>*{min-width:100%}}
</style>
</head>
<body>
<header><h1>FemPhoto</h1><div class="sub">肌を整えて、体のラインをほんの少し自然に調整</div></header>
<main>
<div class="card">
  <div class="row">
    <label class="filelabel" for="file">📷 写真を選ぶ</label>
    <button id="save" disabled>保存する</button>
    <input id="file" type="file" accept="image/*">
  </div>
  <div class="status" id="status"></div>
  <p class="hint">写真はこのブラウザ内だけで処理します。写真をサーバーへアップロードしません。</p>
</div>

<div class="card" id="controls" style="display:none">
  <h3 style="margin-top:0">肌</h3>
  <label>なめらかさ <span class="value" id="skinVal">35</span></label>
  <input class="range" id="skin" type="range" min="0" max="100" value="35">

  <h3>胸</h3>
  <label>ふくらみ <span class="value" id="chestVal">8</span></label>
  <input class="range" id="chest" type="range" min="0" max="25" value="8">

  <label>中心位置 <span class="value" id="cyVal">47%</span></label>
  <input class="range" id="cy" type="range" min="25" max="70" value="47">

  <label>横幅 <span class="value" id="wVal">28%</span></label>
  <input class="range" id="cw" type="range" min="12" max="45" value="28">

  <label>縦幅 <span class="value" id="hVal">20%</span></label>
  <input class="range" id="ch" type="range" min="8" max="35" value="20">

  <p class="hint">胸は左右2つの範囲を滑らかに膨らませます。まず「肌35・胸8」から試し、強くしたい場合は胸を上げてください。</p>
</div>

<div class="card" id="resultCard" style="display:none">
  <div class="preview">
    <figure><img id="before"><figcaption class="cap">元画像</figcaption></figure>
    <figure><img id="after"><figcaption class="cap">加工後</figcaption></figure>
  </div>
</div>
<canvas id="canvas"></canvas>
<p class="danger">※試作版です。正面に近い写真で最も自然に動作します。強い設定では衣服や背景にも変形が及ぶことがあります。</p>
</main>

<script>
const file=document.getElementById('file'), canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d',{willReadFrequently:true});
const before=document.getElementById('before'), after=document.getElementById('after');
const save=document.getElementById('save'), controls=document.getElementById('controls');
const resultCard=document.getElementById('resultCard'), statusEl=document.getElementById('status');
const ids=['skin','chest','cy','cw','ch'];
let originalData=null, originalW=0, originalH=0, rendering=false, queued=false;

function val(id){return +document.getElementById(id).value}
function setText(id,text){document.getElementById(id).textContent=text}
function updateLabels(){
 setText('skinVal',val('skin'));setText('chestVal',val('chest'));
 setText('cyVal',val('cy')+'%');setText('wVal',val('cw')+'%');setText('hVal',val('ch')+'%');
}
ids.forEach(id=>document.getElementById(id).addEventListener('input',()=>{
 updateLabels(); requestRender();
}));

function requestRender(){
 if(!originalData)return;
 if(rendering){queued=true;return}
 render();
}

file.addEventListener('change',()=>{
 const f=file.files[0]; if(!f)return;
 statusEl.textContent='読み込み中…';
 const url=URL.createObjectURL(f), im=new Image();
 im.onload=()=>{
   URL.revokeObjectURL(url);
   const max=1400, scale=Math.min(1,max/im.width,max/im.height);
   originalW=Math.max(1,Math.round(im.width*scale));
   originalH=Math.max(1,Math.round(im.height*scale));
   canvas.width=originalW;canvas.height=originalH;
   ctx.clearRect(0,0,originalW,originalH);
   ctx.drawImage(im,0,0,originalW,originalH);
   originalData=ctx.getImageData(0,0,originalW,originalH);
   before.src=canvas.toDataURL('image/jpeg',.92);
   controls.style.display='block';resultCard.style.display='block';save.disabled=false;
   statusEl.textContent='';
   requestRender();
 };
 im.onerror=()=>{URL.revokeObjectURL(url);statusEl.textContent='画像を読み込めませんでした。'};
 im.src=url;
});

function clamp(v,a,b){return v<a?a:v>b?b:v}
function smoothstep(t){return t*t*(3-2*t)}

function makeSkinBlur(baseData,w,h,amount){
  // Downscale before blurring so the effect is visible while remaining fast on iPhone.
  const smallMax=700, sc=Math.min(1,smallMax/w,smallMax/h);
  const sw=Math.max(1,Math.round(w*sc)), sh=Math.max(1,Math.round(h*sc));
  const bc=document.createElement('canvas');bc.width=sw;bc.height=sh;
  const b=bc.getContext('2d');
  const tmp=document.createElement('canvas');tmp.width=w;tmp.height=h;
  const tc=tmp.getContext('2d');tc.putImageData(baseData,0,0);
  b.drawImage(tmp,0,0,sw,sh);
  b.filter=`blur(${1.5+amount*0.055}px)`;
  b.drawImage(bc,0,0);
  b.filter='none';
  const blur=b.getImageData(0,0,sw,sh);
  const out=new Uint8ClampedArray(baseData.data);
  const strength=0.08+0.58*(amount/100);
  const d=baseData.data;
  for(let y=0;y<h;y++){
    const sy=Math.min(sh-1,Math.floor(y*sc));
    for(let x=0;x<w;x++){
      const sx=Math.min(sw-1,Math.floor(x*sc));
      const i=(y*w+x)*4, j=(sy*sw+sx)*4;
      const r=d[i],g=d[i+1],bb=d[i+2];
      // Skin-like mask in YCbCr-ish RGB conditions. This keeps most clothing/background intact.
      const maxc=Math.max(r,g,bb), minc=Math.min(r,g,bb);
      const skin=(r>g && g>bb && r>65 && g>35 && bb>20 &&
                  (r-g)>8 && (g-bb)>5 && (r-bb)>20 && (maxc-minc)>18);
      if(!skin)continue;
      // Reduce smoothing near very dark pixels to preserve shadows.
      const lumin=(r+g+bb)/3;
      const local=clamp((lumin-45)/100,0,1);
      const a=strength*(0.55+0.45*local);
      out[i]=d[i]*(1-a)+blur[j]*a;
      out[i+1]=d[i+1]*(1-a)+blur[j+1]*a;
      out[i+2]=d[i+2]*(1-a)+blur[j+2]*a;
    }
  }
  return new ImageData(out,w,h);
}

function applyBulge(data,w,h,amount){
  if(amount<=0)return data;
  const src=data.data, out=new Uint8ClampedArray(src);
  const cx=w/2, cy=h*(val('cy')/100);
  const rw=w*(val('cw')/100)*0.31;
  const rh=h*(val('ch')/100)*0.70;
  const separation=w*(val('cw')/100)*0.22;
  const strength=0.10+0.38*(amount/25);
  function sample(sx,sy,channel){
    sx=clamp(sx,0,w-1);sy=clamp(sy,0,h-1);
    const x0=Math.floor(sx),y0=Math.floor(sy),x1=Math.min(w-1,x0+1),y1=Math.min(h-1,y0+1);
    const fx=sx-x0,fy=sy-y0;
    const i00=(y0*w+x0)*4,i10=(y0*w+x1)*4,i01=(y1*w+x0)*4,i11=(y1*w+x1)*4;
    const a=src[i00+channel]*(1-fx)+src[i10+channel]*fx;
    const b=src[i01+channel]*(1-fx)+src[i11+channel]*fx;
    return a*(1-fy)+b*fy;
  }
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      let totalW=0, sx=x, sy=y;
      const centers=[cx-separation,cy,cx+separation,cy];
      for(let k=0;k<2;k++){
        const dx=x-centers[k*2],dy=y-centers[k*2+1];
        const q=(dx*dx)/(rw*rw)+(dy*dy)/(rh*rh);
        if(q<1){
          const t=1-Math.sqrt(q);
          const s=smoothstep(t);
          const local=strength*s;
          // Inverse mapping: pull destination pixels toward the center,
          // producing a smooth local enlargement.
          sx += -dx*local;
          sy += -dy*local*0.45;
          totalW=Math.max(totalW,s);
        }
      }
      if(totalW>0){
        const i=(y*w+x)*4;
        out[i]=sample(sx,sy,0);out[i+1]=sample(sx,sy,1);out[i+2]=sample(sx,sy,2);out[i+3]=src[i+3];
      }
    }
  }
  return new ImageData(out,w,h);
}

async function render(){
 if(!originalData)return;
 rendering=true;queued=false;statusEl.textContent='加工中…';
 await new Promise(r=>setTimeout(r,20));
 const w=originalW,h=originalH;
 let work=originalData;
 const skin=val('skin');
 if(skin>0)work=makeSkinBlur(work,w,h,skin);
 work=applyBulge(work,w,h,val('chest'));
 ctx.putImageData(work,0,0);
 after.src=canvas.toDataURL('image/jpeg',.94);
 rendering=false;statusEl.textContent='';
 if(queued)requestRender();
}

save.addEventListener('click',()=>{
 if(!originalData)return;
 canvas.toBlob(blob=>{
   const a=document.createElement('a'),u=URL.createObjectURL(blob);
   a.href=u;a.download='femphoto-edited.jpg';a.click();
   setTimeout(()=>URL.revokeObjectURL(u),1500);
 },'image/jpeg',.95);
});
updateLabels();
</script>
</body>
</html>
