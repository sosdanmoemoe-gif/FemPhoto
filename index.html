<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6e9ef">
<title>FemPhoto</title>
<style>
:root{--bg:#faf7f8;--card:#fff;--accent:#c86f91;--text:#352b30;--muted:#776b71}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
header{padding:20px 18px 8px;text-align:center}h1{font-size:24px;margin:0 0 5px}.sub{color:var(--muted);font-size:13px}
main{max-width:760px;margin:auto;padding:10px 14px 30px}.card{background:var(--card);border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 2px 14px #0000000d}
button,.filelabel{border:0;border-radius:13px;padding:12px 16px;font-size:15px;font-weight:600;background:var(--accent);color:white;display:inline-block;cursor:pointer}
input[type=file]{display:none}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
label{font-size:14px}.range{width:100%;accent-color:var(--accent)}.value{float:right;color:var(--muted)}
.preview{display:grid;grid-template-columns:1fr 1fr;gap:10px}.preview figure{margin:0}.preview img{width:100%;border-radius:12px;background:#eee;display:block}.cap{text-align:center;font-size:12px;color:var(--muted);margin-top:5px}
canvas{display:none}.hint{font-size:12px;line-height:1.6;color:var(--muted)}.danger{font-size:11px;color:#8b5c68}
@media(max-width:500px){.preview{grid-template-columns:1fr}.row>*{min-width:100%}}
</style>
</head>
<body>
<header><h1>FemPhoto</h1><div class="sub">肌を整えて、体のラインをほんの少し自然に調整</div></header>
<main>
<div class="card">
  <div class="row">
    <label class="filelabel" for="file">📷 写真を選ぶ</label>
    <button id="save" disabled>保存する</button>
    <input id="file" type="file" accept="image/*">
  </div>
  <p class="hint">写真はこのブラウザ内で処理します。サーバーへのアップロードは行いません。</p>
</div>

<div class="card" id="controls" style="display:none">
  <h3 style="margin-top:0">肌</h3>
  <label>なめらかさ <span class="value" id="skinVal">35</span></label>
  <input class="range" id="skin" type="range" min="0" max="100" value="35">
  <h3>胸</h3>
  <label>ふくらみ <span class="value" id="chestVal">8</span></label>
  <input class="range" id="chest" type="range" min="0" max="25" value="8">
  <label>中心位置 <span class="value" id="cyVal">47%</span></label>
  <input class="range" id="cy" type="range" min="25" max="70" value="47">
  <label>横幅 <span class="value" id="wVal">28%</span></label>
  <input class="range" id="cw" type="range" min="12" max="45" value="28">
  <label>縦幅 <span class="value" id="hVal">20%</span></label>
  <input class="range" id="ch" type="range" min="8" max="35" value="20">
  <p class="hint">正面写真なら、まず「肌35・胸8」程度から試すのがおすすめです。写真によって中心位置を調整してください。</p>
</div>

<div class="card" id="resultCard" style="display:none">
  <div class="preview">
    <figure><img id="before"><figcaption class="cap">元画像</figcaption></figure>
    <figure><img id="after"><figcaption class="cap">加工後</figcaption></figure>
  </div>
</div>
<canvas id="canvas"></canvas>
<p class="danger">※この試作版は美容目的の簡易加工です。複雑なポーズや鏡越し写真では変形が不自然になる場合があります。</p>
</main>
<script>
const file=document.getElementById('file'), canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
const before=document.getElementById('before'), after=document.getElementById('after'), save=document.getElementById('save');
const controls=document.getElementById('controls'), resultCard=document.getElementById('resultCard');
const ids=['skin','chest','cy','cw','ch'];
let img=null, originalData=null;
function val(id){return +document.getElementById(id).value}
function setText(id,text){document.getElementById(id).textContent=text}
ids.forEach(id=>document.getElementById(id).addEventListener('input',()=>{updateLabels(); if(img)render()}));
function updateLabels(){
 setText('skinVal',val('skin'));setText('chestVal',val('chest'));setText('cyVal',val('cy')+'%');
 setText('wVal',val('cw')+'%');setText('hVal',val('ch')+'%');
}
file.addEventListener('change',()=>{
 const f=file.files[0]; if(!f)return;
 const url=URL.createObjectURL(f); img=new Image();
 img.onload=()=>{ URL.revokeObjectURL(url);
   const max=1800, scale=Math.min(1,max/img.width,max/img.height);
   canvas.width=Math.round(img.width*scale); canvas.height=Math.round(img.height*scale);
   ctx.drawImage(img,0,0,canvas.width,canvas.height);
   originalData=ctx.getImageData(0,0,canvas.width,canvas.height);
   before.src=canvas.toDataURL('image/jpeg',.92);
   controls.style.display='block'; resultCard.style.display='block'; save.disabled=false; render();
 };
 img.src=url;
});
function render(){
 if(!img)return;
 const w=canvas.width,h=canvas.height;
 // Start from original pixels
 ctx.putImageData(originalData,0,0);
 // 1) Mild skin smoothing: blurred layer with a soft, low-opacity blend.
 const blurCanvas=document.createElement('canvas'); blurCanvas.width=w;blurCanvas.height=h;
 const bctx=blurCanvas.getContext('2d');
 bctx.drawImage(canvas,0,0);
 const s=val('skin');
 if(s>0){
   bctx.filter=`blur(${(s/100)*2.2+0.4}px)`;
   bctx.drawImage(canvas,0,0);
   bctx.filter='none';
   ctx.globalAlpha=(s/100)*0.34;
   ctx.drawImage(blurCanvas,0,0);
   ctx.globalAlpha=1;
 }
 // 2) Local radial bulge for the chest. Conservative, smooth displacement.
 const amount=val('chest');
 if(amount>0){
   const src=document.createElement('canvas');src.width=w;src.height=h;
   src.getContext('2d').drawImage(canvas,0,0);
   const sc=src.getContext('2d');
   const sw=w*(val('cw')/100), sh=h*(val('ch')/100), cy=h*(val('cy')/100), cx=w/2;
   // Draw a grid of small vertical strips; each strip is shifted outward around center.
   // This approximates a smooth bulge without requiring external libraries.
   const strips=220, stripW=w/strips, strength=(amount/25)*0.075;
   for(let i=0;i<strips;i++){
     const x=i*stripW, mid=x+stripW/2, dx=mid-cx;
     const q=(dx/(sw/2))**2;
     const mask=Math.exp(-q*2.2);
     const shift=dx*mask*strength;
     const sx=x+shift, sw2=stripW+Math.max(0,Math.abs(shift))*0.02;
     ctx.drawImage(src,sx,0,sw2,h,x,0,stripW,h);
   }
 }
 after.src=canvas.toDataURL('image/jpeg',.94);
}
save.addEventListener('click',()=>{
 canvas.toBlob(blob=>{
   const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='femphoto-edited.jpg';a.click();
   setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 },'image/jpeg',.95);
});
updateLabels();
</script>
</body>
</html>
